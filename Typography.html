<html> <!--what is typography-->
    <head>
        <style>
        body {
            font-family:Arial,
            sans-sarif;
            line-height:1.5;
        }
        .tight {
            line-height:15;
        }
        .loose {
            line-height:1.8;
        }
        .light {
            font-weight: 300;
        }
        .bold {
            font-weight:900;
        }
        </style>
    </head>
    <body>
        <p class="tight">
            Tight line-height makes text harder to read when context is long
        </p>
        <p class="loose">
            Loose line-hight improves readablity, esspecially for paragraphs
        </p>
        <p class="light">
            Light font weight is sobtle and modern
        </p>
        <p class="bold">
            Bold font weight is good for emphasis and headings
        </p>
    </body>
</html>
